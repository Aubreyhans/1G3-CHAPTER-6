<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>汉字闯关 · Hanzi Quest</title>

<style>
:root{
  --paper:#f6f0e3;--card:#fffaf1;--ink:#231e17;--soft:#6a5f50;--line:#e3d8c1;
  --red:#c2392b;--btn:#c2392b;--btn-d:#982b1f;--gold:#d09a26;--jade:#2e7d5a;--jade-bg:#dff0e5;
  --bad:#b3261e;--bad-bg:#f8e0dc;--sel-bg:#fbe6e2;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px rgba(60,40,10,.08);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#17130e;--card:#221d16;--ink:#f1e8d6;--soft:#b2a58f;--line:#3a3226;--red:#e0584a;
    --jade:#58b98b;--jade-bg:#183427;--bad:#f0877d;--bad-bg:#3b1d19;--sel-bg:#3b211d;--gold:#e6b550;
    --shadow:0 6px 18px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 var(--sans);color:var(--ink);
  background:radial-gradient(circle at 8% -5%,rgba(194,57,43,.10),transparent 38%),radial-gradient(circle at 100% 100%,rgba(208,154,38,.10),transparent 40%),var(--paper);
  min-height:100vh;min-height:100dvh}
#app{max-width:720px;margin:0 auto;padding:16px 16px 64px}
h1,h2{font-family:var(--serif);margin:0}
h2{font-size:1.25rem;line-height:1.35;margin:18px 0 8px}
.sub{color:var(--soft);margin:4px 0 12px}
.note{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:.9rem}
.hidden{display:none!important}
.center{text-align:center}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.zhw,.big,.tile,.slot,.sentence{font-family:var(--serif)}

/* buttons */
.btn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 20px;font-weight:600;cursor:pointer;min-height:48px}
.btn.primary{background:var(--btn);border-color:var(--btn-d);color:#fff;box-shadow:0 3px 0 var(--btn-d)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-d)}
.btn.ghost{background:transparent}
.btn.quiet{border-color:transparent;background:transparent;color:var(--soft);padding:10px 12px;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.spk{border:2px solid var(--line);background:var(--card);border-radius:50%;width:48px;height:48px;font-size:1.2rem;cursor:pointer;flex:none}
.spk.sm{width:40px;height:40px;font-size:1rem}
.spk.huge{width:88px;height:88px;font-size:2.2rem;border-color:var(--red);box-shadow:var(--shadow)}

/* home */
.hero{text-align:center;padding:28px 0 8px}
.seal{width:76px;height:76px;margin:0 auto 10px;border-radius:14px;background:var(--btn);color:#fff;display:grid;place-items:center;font:700 2.7rem var(--serif);transform:rotate(-4deg);box-shadow:var(--shadow)}
.hero h1{font-size:2.2rem;letter-spacing:.12em}
.tag{color:var(--soft);margin:4px 0 12px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;font-size:.9rem}
.map{list-style:none;padding:0;margin:8px 0;display:grid;gap:12px}
.level{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.level:not(:disabled):hover{border-color:var(--red)}
.level:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.level .n{width:44px;height:44px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-weight:700}
.level:disabled .n{background:var(--soft)}
.level .ws{font:500 1.05rem/1.4 var(--serif)}
.level .meta{color:var(--soft);font-size:.8rem}
.level .st{font-size:1.1rem;color:var(--gold);white-space:nowrap}
footer{margin-top:28px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* level shell */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lv{font:700 1.05rem var(--serif)}
.xp{font-weight:600;font-size:.9rem;min-width:84px;text-align:right}
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:10px 0 4px}
.steps li{flex:1;height:8px;border-radius:99px;background:var(--line);position:relative}
.steps li span{position:absolute;left:0;top:12px;font-size:.62rem;color:var(--soft);white-space:nowrap;display:none}
.steps li.done{background:var(--jade)}
.steps li.now{background:var(--red)}
.steps li.now span{display:block}
.stage{padding-top:14px}
.count{color:var(--soft);font-size:.85rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* cards */
.cards{display:grid;gap:12px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:2rem;font-weight:700;line-height:1.2}
.big.xl{font-size:2.8rem}
.py{color:var(--red);font-weight:600}
.py.xl{font-size:1.9rem;font-family:var(--sans)}
.en{font-weight:600}
.en.lg{font-size:1.5rem}
.zh{color:var(--soft);font-size:.95rem;font-family:var(--serif)}
.ex{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-family:var(--serif)}
mark{background:linear-gradient(transparent 55%,rgba(208,154,38,.5) 0);color:inherit}
.focus{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 14px;margin:10px 0;box-shadow:var(--shadow);display:grid;gap:6px;justify-items:center}

/* tiles */
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0}
.slot{width:50px;height:60px;border-bottom:3px solid var(--ink);display:inline-grid;place-items:center;font-size:2rem;font-weight:700}
.slot.filled{border-color:var(--jade);color:var(--jade)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px;margin:14px 0}
.tiles.wide{display:flex;flex-wrap:wrap;justify-content:center;min-height:70px}
.tile{font-size:1.7rem;font-weight:600;line-height:1;min-height:64px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile.used{opacity:.22}
.tile.chunk{font-size:1.25rem;min-height:56px}
.answer{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;min-height:92px;padding:14px;border:2px dashed var(--line);border-radius:16px;background:var(--card);margin:12px 0}
.answer.good{border-color:var(--jade);background:var(--jade-bg)}
.ph{color:var(--soft);align-self:center}
.hintbar{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;color:var(--soft)}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:grid;gap:10px;align-content:start}
.mbtn{min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:8px 10px;font-weight:600;cursor:pointer;word-break:break-word}
.mbtn.zhw{font-size:1.3rem}
.mbtn.sel{border-color:var(--red);background:var(--sel-bg)}
.mbtn.ok{border-color:var(--jade);background:var(--jade-bg);cursor:default}

/* quiz */
.sentence{font-size:1.4rem;line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--red);color:var(--red);text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.opt{min-height:66px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.3rem;padding:8px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--jade-bg);border-color:var(--jade)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.typeform{display:flex;gap:10px;margin:12px 0}
.typeform input{flex:1;min-width:0;font:600 1.5rem var(--serif);padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}

/* mic + feedback */
.mic{text-align:center;margin:14px 0}
.mic-btn{font-size:1.15rem;padding:16px 28px;border-radius:999px}
.mic-btn.listening{animation:pulse 1s infinite;border-color:var(--red)}
.msg{color:var(--soft);min-height:1.5em;margin:8px 0}
.fb{min-height:1.6em;text-align:center;font-weight:600;border-radius:12px}
.fb.good{color:var(--jade);background:var(--jade-bg);padding:10px}
.fb.bad{color:var(--bad);background:var(--bad-bg);padding:10px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,57,43,.5)}100%{box-shadow:0 0 0 18px rgba(194,57,43,0)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* results */
.result{text-align:center}
.stars{font-size:3rem;color:var(--gold);letter-spacing:.1em}
.score{font:700 1.6rem var(--serif)}
.chiplist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.chiplist span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-family:var(--serif)}
.list{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.list li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (max-width:420px){.big.xl{font-size:2.3rem}.opts{gap:8px}.slot{width:40px;height:52px;font-size:1.7rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = s => s.replace(/[\s，。、！？；：,.!?;:'"“”‘’（）()\-—]/g, '');
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hl = (sent, word) => esc(sent).replace(esc(word), '<mark>' + esc(word) + '</mark>');
const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };

/* ---------- Speech: text-to-speech ---------- */
let zhVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
}
function say(text, rate = 0.8) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = rate;
    if (zhVoice) u.voice = zhVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function audioNote() {
  if (!('speechSynthesis' in window)) return '<p class="note">🔇 This browser can’t play spoken audio. Try Chrome, Edge or Safari.</p>';
  const vs = speechSynthesis.getVoices();
  if (vs.length && !zhVoice) return '<p class="note">🔇 No Chinese voice found on this device. Install a Chinese (zh-CN) text-to-speech voice in your system settings.</p>';
  return '';
}
function bindSpeak(root) { root.querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say)); }

/* ---------- Speech: recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function spokenOK(alts, word) {
  const w = strip(word);
  return alts.some(t => {
    const s = strip(t);
    if (s.includes(w)) return true;
    if (w.length >= 4) return 1 - lev(s, w) / Math.max(s.length, w.length) >= 0.7;
    return false;
  });
}
function listenOnce(done) {
  let finished = false;
  const fin = r => { if (!finished) { finished = true; done(r); } };
  try {
    const r = new SR();
    r.lang = 'zh-CN'; r.maxAlternatives = 5; r.interimResults = false; r.continuous = false;
    r.onresult = e => {
      const alts = [];
      for (let i = 0; i < e.results.length; i++) for (let j = 0; j < e.results[i].length; j++) alts.push(e.results[i][j].transcript);
      fin({ alts });
    };
    r.onerror = e => fin({ error: e.error || 'error' });
    r.onend = () => fin({ error: 'no-speech' });
    r.start();
  } catch (e) { fin({ error: 'start-failed' }); }
}
const micHTML = () => `<div class="mic"><button class="btn mic-btn" id="micBtn">🎤 Tap and speak</button><p class="msg" id="micMsg" aria-live="polite"></p><div class="actions" id="micAlt" style="margin:0"></div></div>`;
function wireMic(word, onPass) {
  const btn = $('#micBtn'), msg = $('#micMsg'), alt = $('#micAlt');
  let busy = false, tries = 0;
  const offerSelf = () => {
    alt.innerHTML = '<button class="btn ghost" id="selfOk">✔ I said it correctly</button>';
    $('#selfOk').onclick = () => onPass(true);
  };
  if (!SR) {
    msg.textContent = 'Voice recognition isn’t available in this browser (Chrome, Edge or Safari work best). Say the word aloud, then self-check.';
    btn.disabled = true; offerSelf(); return;
  }
  const errs = {
    'not-allowed': 'Microphone access is blocked. Allow it in your browser settings, or self-check below.',
    'service-not-allowed': 'Microphone access is blocked. Allow it in your browser settings, or self-check below.',
    'no-speech': 'I didn’t hear anything. Try again.',
    'audio-capture': 'No microphone found. Self-check below.',
    'network': 'Speech service unreachable. Try again or self-check.'
  };
  btn.onclick = () => {
    if (busy) return;
    busy = true; btn.classList.add('listening'); btn.textContent = '🎙 Listening…'; msg.textContent = '';
    listenOnce(res => {
      busy = false; btn.classList.remove('listening'); btn.textContent = '🎤 Tap and speak'; tries++;
      if (res.error) { msg.textContent = errs[res.error] || ('Couldn’t listen (' + res.error + '). Try again.'); offerSelf(); return; }
      if (spokenOK(res.alts, word)) onPass(false);
      else { msg.innerHTML = 'I heard: <b>' + esc(res.alts[0] || '…') + '</b>. Try again!'; if (tries >= 1) offerSelf(); }
    });
  };
}

/* Stage 1: hear it, tap the characters in order */
function stage1() {
  const st = shell(1), q = shuffle(S.words);
  let i = 0;
  const round = () => {
    if (i >= q.length) return go(2);
    const w = q[i];
    const chars = [...w.w].filter(c => !/[，、,\s]/.test(c));
    const pool = [...new Set(WORDS.filter(x => x !== w).flatMap(x => [...x.w]).filter(c => !/[，、,\s]/.test(c) && !chars.includes(c)))];
    const n = Math.max(4, 8 - chars.length);
    const tiles = shuffle([...chars, ...shuffle(pool).slice(0, n)]);
    st.innerHTML = `
      <div class="count">Word ${i + 1} / ${q.length}</div>
      <h2>Listen, then tap the characters in order</h2>
      <div class="center"><button class="spk huge" id="play" aria-label="Play the word">🔊</button></div>
      <div class="slots" id="slots">${chars.map(() => '<span class="slot"></span>').join('')}</div>
      <div class="tiles" id="tiles">${tiles.map((c, k) => `<button class="tile" data-k="${k}">${esc(c)}</button>`).join('')}</div>
      <div class="hintbar"><button class="btn quiet" id="hint">💡 Hint</button><span id="hintTxt"></span></div>${tail}`;
    const slots = [...st.querySelectorAll('.slot')];
    let pos = 0, missed = false;
    $('#play').onclick = () => say(w.w);
    setTimeout(() => say(w.w), 200);
    $('#hint').onclick = () => { missed = true; $('#hintTxt').textContent = w.py + ' · ' + w.en; };
    st.querySelectorAll('.tile').forEach(b => b.onclick = () => {
      if (b.disabled) return;
      if (tiles[+b.dataset.k] === chars[pos]) {
        slots[pos].textContent = chars[pos]; slots[pos].classList.add('filled');
        b.disabled = true; b.classList.add('used'); pos++;
        if (pos === chars.length) {
          st.querySelectorAll('.tile').forEach(x => x.disabled = true);
          S.xp += missed ? 5 : 10;
          $('#fb').className = 'fb good';
          $('#fb').innerHTML = `✅ <span class="zhw">${esc(w.w)}</span> <span class="py">${esc(w.py)}</span> — ${esc(w.en)}`;
          $('#next').classList.remove('hidden');
          say(w.w);
        }
      } else { missed = true; shake(b); }
    });
    $('#next').onclick = () => { i++; round(); };
  };
  round();
}

  const st = shell(2), L = shuffle(S.words), R = shuffle(S.words);

  st.innerHTML = `

    <div class="match">
      <div class="col">${L.map(w => `<button class="mbtn zhw" data-side="l" data-id="${w.id}">${esc(w.w)}</button>`).join('')}</div>
      <div class="col">${R.map(w => `<button class="mbtn" data-side="r" data-id="${w.id}">${esc(w.en)}</button>`).join('')}</div>
    </div>${tail}`;
  $('#next').textContent = 'Next stage →';
  st.querySelectorAll('.mbtn').forEach(b => b.onclick = () => {
    if (b.classList.contains('ok')) return;
    if (b.dataset.side === 'l') {
      st.querySelectorAll('.mbtn[data-side="l"]').forEach(x => x.classList.remove('sel'));
      sel = b; b.classList.add('sel'); $('#fb').textContent = '';
      say(WORDS[+b.dataset.id].w);
    } else {
      if (!sel) { $('#fb').textContent = 'Pick a Chinese word first 👈'; return; }
      if (sel.dataset.id === b.dataset.id) {
        sel.classList.remove('sel'); sel.classList.add('ok'); b.classList.add('ok'); sel = null; done++; S.xp += 10;
        if (done === L.length) { $('#fb').className = 'fb good'; $('#fb').textContent = '✅ All matched!'; $('#next').classList.remove('hidden'); }
      } else { shake(sel); shake(b); sel.classList.remove('sel'); sel = null; }
    }
  });
  $('#next').onclick = () => go(3);
}

/* Stage 3: pronounce the word */
function stage3() {
  const st = shell(3), q = shuffle(S.words);
  let i = 0;
  const round = () => {
    if (i >= q.length) return go(4);
    const w = q[i];
    st.innerHTML = `
      <div class="count">Word ${i + 1} / ${q.length}</div>
      <h2>Say it out loud</h2>
      <div class="focus"><div class="big xl">${esc(w.w)}</div><div class="py">${esc(w.py)}</div><div class="en">${esc(w.en)}</div>
        <button class="btn ghost" id="listen">🔊 Hear the model</button></div>
      ${micHTML()}${tail}`;
    $('#listen').onclick = () => say(w.w);
    let passed = false;
    wireMic(w.w, self => {
      if (passed) return; passed = true;
      $('#micBtn').disabled = true; $('#micAlt').innerHTML = '';
      S.xp += self ? 5 : 10;
      $('#fb').className = 'fb good'; $('#fb').textContent = self ? '✅ Great, keep practising!' : '✅ Well said!';
      $('#next').classList.remove('hidden');
    });
    $('#next').onclick = () => { i++; round(); };
  };
  round();
}

/* Stage 4: rearrange the pieces to build the sentence */
function stage4() {
  const st = shell(4), q = shuffle(S.words);
  let i = 0;
  const round = () => {
    if (i >= q.length) return go(5);
    const w = q[i], correct = w.s.join('');
    const items = w.s.map((t, k) => ({ id: k, t }));
    let order = shuffle(items), guard = 0;
    while (items.length > 1 && order.map(x => x.t).join('') === correct && guard++ < 20) order = shuffle(items);
    let pool = [...order], ans = [], solved = false;
    st.innerHTML = `
      <div class="count">Sentence ${i + 1} / ${q.length}</div>
      <h2>Put the pieces in order to make a sentence</h2>
      <p class="sub">Key word: <b class="zhw">${esc(w.w)}</b> — ${esc(w.en)}</p>
      <div class="answer" id="ans"></div>
      <div class="tiles wide" id="pool"></div>
      <div class="actions"><button class="btn ghost" id="reset">↺ Reset</button><button class="btn primary" id="check" disabled>Check</button></div>${tail}`;
    const draw = () => {
      $('#ans').innerHTML = ans.length ? ans.map(x => `<button class="tile chunk" data-id="${x.id}">${esc(x.t)}</button>`).join('') : '<span class="ph">Tap the pieces below…</span>';
      $('#pool').innerHTML = pool.map(x => `<button class="tile chunk" data-id="${x.id}">${esc(x.t)}</button>`).join('');
      $('#check').disabled = pool.length > 0 || solved;
    };
    const move = (from, to, id) => { const k = from.findIndex(x => x.id === id); if (k > -1) to.push(from.splice(k, 1)[0]); };
    $('#pool').onclick = e => { const b = e.target.closest('.tile'); if (!b || solved) return; move(pool, ans, +b.dataset.id); $('#fb').textContent = ''; $('#fb').className = 'fb'; draw(); };
    $('#ans').onclick = e => { const b = e.target.closest('.tile'); if (!b || solved) return; move(ans, pool, +b.dataset.id); draw(); };
    $('#reset').onclick = () => { if (solved) return; pool = [...order]; ans = []; draw(); };
    $('#check').onclick = () => {
      if (ans.map(x => x.t).join('') === correct) {
        solved = true; S.xp += 15 - Math.min(10, (S.s4miss || 0) * 5); S.s4miss = 0;
        $('#ans').classList.add('good'); $('#check').disabled = true; $('#reset').disabled = true;
        $('#fb').className = 'fb good'; $('#fb').innerHTML = '✅ ' + hl(w.sent, w.w);
        $('#next').classList.remove('hidden'); say(w.sent);
      } else {
        S.s4miss = (S.s4miss || 0) + 1; shake($('#ans'));
        $('#fb').className = 'fb bad'; $('#fb').textContent = 'Not quite. Tap a piece to take it back, then try again.';
      }
    };
    $('#next').onclick = () => { i++; round(); };
    draw();
  };
  round();
}

/* ---------- Checkpoint quiz ---------- */
function distract(w, n) {
  const pool = WORDS.slice(0, (S.b + 1) * PER).filter(x => x !== w);
  const len = [...w.w].length;
  const same = shuffle(pool.filter(x => [...x.w].length === len));
  const rest = shuffle(pool.filter(x => !same.includes(x)));
  return [...same, ...rest].slice(0, n);
}
function buildQuiz() {
  const bw = S.words, need = 7 - bw.length, earlier = WORDS.slice(0, S.b * PER);
  const extras = (earlier.length ? shuffle(earlier) : shuffle(bw)).slice(0, need);
  const words = shuffle([...bw, ...extras]);
  const base = ['cloze', 'meaning', 'type', 'speak'];
  const types = shuffle([...base, ...shuffle(base).slice(0, 3)]);
  return words.map((w, i) => ({ w, type: types[i] }));
}
function quiz() {
  const st = shell(5);
  S.qs = buildQuiz(); S.qi = 0; S.score = 0;
  ask();
}
function ask() {
  const st = $('#stage'), q = S.qs[S.qi], w = q.w;
  let answered = false;
  const head = `<div class="count">Question ${S.qi + 1} / ${S.qs.length} · ✔ ${S.score}</div>`;
  const finish = ok => {
    if (answered) return; answered = true;
    if (ok) { S.score++; S.xp += 10; }
    const last = S.qi === S.qs.length - 1;
    $('#fb').className = 'fb ' + (ok ? 'good' : 'bad');
    $('#fb').innerHTML = (ok ? '✅ Correct! ' : '❌ Answer: ') + `<span class="zhw">${esc(w.w)}</span> <span class="py">${esc(w.py)}</span> — ${esc(w.en)}`;
    const nx = $('#next'); nx.textContent = last ? 'See results' : 'Next →'; nx.classList.remove('hidden');
    const sk = $('#skip'); if (sk) sk.classList.add('hidden');
    say(w.w);
  };
  if (q.type === 'cloze' || q.type === 'meaning') {
    const opts = shuffle([w, ...distract(w, 3)]);
    const prompt = q.type === 'cloze'
      ? `<h2>Choose the word that completes the sentence</h2><p class="sentence">${esc(w.sent).replace(esc(w.w), '<span class="blank">＿＿＿</span>')}</p>`
      : `<h2>Which word matches this meaning?</h2><div class="focus"><div class="en lg">${esc(w.en)}</div><div class="zh">${esc(w.zh)}</div></div>`;
    st.innerHTML = head + prompt + `<div class="opts">${opts.map((o, k) => `<button class="opt zhw" data-k="${k}">${esc(o.w)}</button>`).join('')}</div>` + tail;
    st.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (answered) return;
      const ok = opts[+b.dataset.k] === w;
      st.querySelectorAll('.opt').forEach((x, k) => { x.disabled = true; if (opts[k] === w) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      finish(ok);
    });
  } else if (q.type === 'type') {
    st.innerHTML = head + `
      <h2>Type the word in Chinese characters</h2>
      <div class="focus"><div class="py xl">${esc(w.py)}</div><div class="en">${esc(w.en)}</div></div>
      <form id="tf" class="typeform" autocomplete="off">
        <input id="ti" type="text" lang="zh-CN" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="汉字…" aria-label="Type the characters">
        <button class="btn primary" type="submit">Check</button>
      </form>
      <p class="sub center">Tip: switch to your Chinese (pinyin) keyboard to type.</p>` + tail;
    const ti = $('#ti');
    ti.focus();
    ti.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault(); });
    $('#tf').onsubmit = e => {
      e.preventDefault();
      if (answered) return;
      const v = strip(ti.value); if (!v) return;
      ti.disabled = true; $('#tf button').disabled = true;
      finish(v === strip(w.w));
    };
  } else {
    st.innerHTML = head + `
      <h2>Read this out loud</h2>
      <div class="focus"><div class="py xl">${esc(w.py)}</div><div class="en">${esc(w.en)}</div></div>
      ${micHTML()}
      <div class="actions"><button class="btn quiet" id="skip">Skip</button></div>` + tail;
    wireMic(w.w, () => { $('#micBtn').disabled = true; $('#micAlt').innerHTML = ''; finish(true); });
    $('#skip').onclick = () => { if (answered) return; $('#micBtn').disabled = true; $('#micAlt').innerHTML = ''; finish(false); };
  }
  $('#next').onclick = () => { S.qi++; if (S.qi < S.qs.length) { ask(); window.scrollTo(0, 0); } else result(); };
}

function result() {
  const st = $('#stage'), b = S.b;
  const pass = S.score >= PASS, stars = S.score === 7 ? 3 : S.score === 6 ? 2 : S.score === 5 ? 1 : 0;
  if (pass) save.cleared[b] = Math.max(save.cleared[b] || 0, stars);
  save.xp += S.xp + (pass ? stars * 20 : 0); S.xp = 0;
  persist();
  const lastLevel = b === BATCHES - 1;
  st.innerHTML = `<div class="result">
    <div class="stars" aria-label="${stars} stars">${starsHTML(stars)}</div>
    <div class="score">${S.score} / ${S.qs.length}</div>
    <h2>${pass ? (lastLevel ? '🎉 You’ve finished every level!' : 'Checkpoint cleared!') : 'So close — you need ' + PASS + ' to pass'}</h2>
    <p class="sub">${pass ? 'These words are now in your pocket:' : 'Review the words and try again with a fresh set of questions.'}</p>
    <div class="chiplist">${S.words.map(w => `<span>${esc(w.w)}</span>`).join('')}</div>
    <div class="actions">
      ${pass && !lastLevel ? '<button class="btn primary" id="nextLv">Next level →</button>' : ''}
      <button class="btn ${pass && !lastLevel ? 'ghost' : 'primary'}" id="retry">${pass ? '↺ Replay checkpoint' : '↺ Try again'}</button>
      ${pass ? '' : '<button class="btn ghost" id="review">📖 Review words</button>'}
      <button class="btn ghost" id="map">Map</button>
    </div></div>`;
  $('#retry').onclick = () => go(5);
  $('#map').onclick = home;
  if ($('#nextLv')) $('#nextLv').onclick = () => startLevel(b + 1);
  if ($('#review')) $('#review').onclick = () => go(0);
  if (pass) confetti();
  window.scrollTo(0, 0);
}

function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const f = document.createElement('div'); f.className = 'confetti'; f.setAttribute('aria-hidden', 'true');
  const cols = ['#c2392b', '#d09a26', '#2e7d5a', '#3a6ea5'];
  for (let i = 0; i < 44; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%'; s.style.background = cols[i % 4];
    s.style.animationDelay = Math.random() * 0.8 + 's'; s.style.animationDuration = 2 + Math.random() * 1.5 + 's';
    f.appendChild(s);
  }
  document.body.appendChild(f); setTimeout(() => f.remove(), 4800);
}

home();
})();
</script>
</body>
